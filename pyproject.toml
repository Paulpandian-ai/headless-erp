[project]
name = "anerp"
version = "0.2.0"
description = "Agent-native headless ERP kernel: typed business-operation tools over MCP and A2A on a double-entry ledger."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "anerp contributors" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "cryptography>=43",
    "pyyaml>=6.0",
    "mcp>=1.9",
    "a2a-sdk>=0.2.5",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40", "claude-agent-sdk>=0.1"]
openai = ["openai>=1.50", "openai-agents>=0.1"]
google = ["google-adk>=1.0"]
eval = ["matplotlib>=3.9"]

[project.scripts]
anerp = "anerp.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.110",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anerp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "SIM108", "E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["anerp.core.*", "anerp.ledger.*", "anerp.policy.*"]
strict = true
disallow_any_generics = false
warn_return_any = false

# SQLModel column expressions (Model.col.desc(), .in_(), order_by(Model.col)) are typed as the
# Python value type; these codes are false positives outside the strictly-typed kernel packages.
[[tool.mypy.overrides]]
module = ["anerp.finance.*", "anerp.procurement.*", "anerp.sales.*", "anerp.masterdata.*", "anerp.approvals.*", "anerp.admin.*", "anerp.troubleshoot.*", "anerp.mcp_server.*", "anerp.a2a_agent.*", "anerp.eval.*", "anerp.documents", "anerp.seed", "anerp.server", "anerp.cli", "anerp.db"]
disable_error_code = ["attr-defined", "arg-type", "union-attr", "unused-ignore", "no-any-return", "var-annotated", "assignment", "type-arg", "no-redef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires hosted database (ANERP_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["anerp"]
