# Deploys `dev` on push to main and `demo` on tags v*. Host: Fly.io (non-AWS, DESIGN.md §16/§20).
# Required repository secrets: FLY_API_TOKEN. App secrets (ANERP_DATABASE_URL, ANERP_TOKEN_PEPPER,
# ANERP_BOOTSTRAP_ADMIN_TOKEN, ANERP_SIGNING_KEY_PEM, LLM keys) are set on the Fly app, never here.
name: deploy
on:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Pick target
        id: target
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "app=anerp-demo" >> "$GITHUB_OUTPUT"; echo "env=demo" >> "$GITHUB_OUTPUT"
          else
            echo "app=anerp-dev" >> "$GITHUB_OUTPUT"; echo "env=dev" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy (migrations run in the release command, never at request time)
        run: flyctl deploy --remote-only --config deploy/fly.toml --app "${{ steps.target.outputs.app }}" --env ANERP_ENV="${{ steps.target.outputs.env }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: curl -fsS "https://${{ steps.target.outputs.app }}.fly.dev/healthz"
