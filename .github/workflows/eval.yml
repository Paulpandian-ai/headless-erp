# Manual: run the evaluation matrix (DESIGN.md §14) on GitHub Actions and upload results as an
# artifact. One job per client (vendor) against its own Postgres service container, running the
# arms one after the other - a vendor's two arms in parallel double the token rate and trip the
# org's tokens-per-minute limit, and a single job for everything would exceed the 6-hour limit -
# then a merge job that rebuilds summary.csv, latency.csv and report.md over every row with
# `anerp eval-merge`.
#
# Defaults are the tier-matched cross-vendor comparison: each vendor's mid-tier model, both arms,
# all 20 tasks, 3 runs. Override the model inputs to run a different tier. Pushing a tag named
# eval-matrix-<anything> launches the default matrix with the tag as run id (for environments
# whose token cannot dispatch workflows); `eval-matrix-<id>+<client>[+<client>]` restricts it to
# those clients, and `,key=value` suffixes override servers, runs, tasks (an id that names no task is a prefix: `tasks=p2p`), step_factor and
# step_factor_control (e.g. `eval-matrix-4+google_adk,servers=control,step_factor_control=5`).
name: eval
on:
  push:
    tags: ["eval-matrix-*"]
  workflow_dispatch:
    inputs:
      clients:
        description: "Comma-separated client adapters"
        default: "claude_agent_sdk,openai_agents_sdk,google_adk"
      servers:
        description: "Comma-separated tool surfaces"
        default: "treatment,control"
      runs:
        description: "Runs per task x client x server"
        default: "3"
      tasks:
        description: "Comma-separated task ids or 'all'"
        default: "all"
      run_id:
        description: "Name of results/<run_id>/ (default: matrix-<workflow run number>)"
        default: ""
      anthropic_model:
        description: "ANERP_ANTHROPIC_MODEL"
        default: "claude-sonnet-5"
      openai_model:
        description: "ANERP_OPENAI_MODEL"
        default: "gpt-5.6-terra"
      google_model:
        description: "ANERP_GOOGLE_MODEL"
        default: "gemini-3.8-flash"
      commit_results:
        description: "Commit the merged results/<run_id>/ back to the branch"
        type: boolean
        default: false

env:
  RUN_ID: ${{ inputs.run_id || (github.ref_type == 'tag' && github.ref_name) || format('matrix-{0}', github.run_number) }}
  PYTHONUNBUFFERED: "1"
  CLIENTS: ${{ inputs.clients || 'claude_agent_sdk,openai_agents_sdk,google_adk' }}
  SERVERS: ${{ inputs.servers || 'treatment,control' }}
  RUNS: ${{ inputs.runs || '3' }}
  TASKS: ${{ inputs.tasks || 'all' }}
  ANTHROPIC_MODEL: ${{ inputs.anthropic_model || 'claude-sonnet-5' }}
  OPENAI_MODEL: ${{ inputs.openai_model || 'gpt-5.6-terra' }}
  GOOGLE_MODEL: ${{ inputs.google_model || 'gemini-3.8-flash' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      servers: ${{ steps.plan.outputs.servers }}
      runs: ${{ steps.plan.outputs.runs }}
      tasks: ${{ steps.plan.outputs.tasks }}
      step_factor: ${{ steps.plan.outputs.step_factor }}
      step_factor_control: ${{ steps.plan.outputs.step_factor_control }}
    steps:
      - id: plan
        shell: python
        run: |
          import json, os
          opts = {"servers": os.environ["SERVERS"], "runs": os.environ["RUNS"], "tasks": os.environ["TASKS"],
                  "step_factor": "1", "step_factor_control": "1"}
          clients = [c.strip() for c in os.environ["CLIENTS"].split(",") if c.strip()]
          ref = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and "+" in ref:
              parts = ref.split(",")
              clients = parts[0].split("+")[1:]
              for kv in parts[1:]:
                  k, _, v = kv.partition("=")
                  if k in opts and v:
                      opts[k] = v
          include = [{"client": c} for c in clients]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": include}) + "\n")
              for k, v in opts.items():
                  f.write(f"{k}={v}\n")

  arm:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: anerp
          POSTGRES_PASSWORD: anerp
          POSTGRES_DB: anerp_eval
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --dev
      - name: Isolated interpreter for google-adk (needs mcp 1.x)
        if: matrix.client == 'google_adk'
        run: uv venv .venv-adk --python 3.12 && uv pip install --python .venv-adk/bin/python google-adk "mcp<2"
      - name: Run ${{ matrix.client }} on both arms
        run: >
          uv run --all-extras anerp eval
          --clients "${{ matrix.client }}" --servers "${{ needs.plan.outputs.servers }}"
          --runs "${{ needs.plan.outputs.runs }}" --tasks "${{ needs.plan.outputs.tasks }}"
          --output results --run-id "${RUN_ID}-${{ matrix.client }}"
        env:
          ANERP_ENV: dev
          ANERP_EVAL_STEP_FACTOR: ${{ needs.plan.outputs.step_factor }}
          ANERP_EVAL_STEP_FACTOR_CONTROL: ${{ needs.plan.outputs.step_factor_control }}
          ANERP_EVAL_DATABASE_URL: postgresql+psycopg://anerp:anerp@127.0.0.1:5432/anerp_eval
          ANERP_ANTHROPIC_MODEL: ${{ env.ANTHROPIC_MODEL }}
          ANERP_OPENAI_MODEL: ${{ env.OPENAI_MODEL }}
          ANERP_GOOGLE_MODEL: ${{ env.GOOGLE_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-arm-${{ matrix.client }}
          path: results/${{ env.RUN_ID }}-${{ matrix.client }}/
          if-no-files-found: warn

  merge:
    needs: arm
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - uses: actions/download-artifact@v4
        with:
          pattern: eval-arm-*
          path: arms
      - name: Merge arms
        run: |
          inputs=$(ls -d arms/eval-arm-*/ 2>/dev/null)
          test -n "$inputs" || { echo "no arm produced results"; exit 1; }
          uv run anerp eval-merge $inputs --output results --run-id "${RUN_ID}"
          cat "results/${RUN_ID}/report.md"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ env.RUN_ID }}
          path: results/${{ env.RUN_ID }}/
      - name: Commit results
        if: ${{ inputs.commit_results && github.ref_type != 'tag' }}
        run: |
          git config user.name "anerp-eval"; git config user.email "eval@users.noreply.github.com"
          git add -f "results/${RUN_ID}/"{raw.jsonl,summary.csv,latency.csv,report.md}
          git commit -m "eval: results for ${RUN_ID}" && git push
