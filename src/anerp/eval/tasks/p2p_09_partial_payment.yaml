id: p2p_09_partial_payment
module: procurement
narrative: >
  Order 10 PUMP-SM from ACME at 400.00, have them received and post the matching invoice ACME-P9.
  Cash is tight: pay only 2,500.00 now and leave the rest outstanding.
seed: baseline
max_steps: 24
human_loop: [goods_acceptance]
goal_state:
  - {check: open_items, kind: ap, party: ACME, total_remaining_cents: 150000}
  - {check: balance_delta, account: "1000", delta_cents: -250000}
  - {check: inventory_delta, sku: PUMP-SM, delta: 10}
  - {check: tb_balanced}
