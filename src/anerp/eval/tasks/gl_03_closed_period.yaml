id: gl_03_closed_period
module: finance
narrative: >
  Post a late consulting fee of 400.00 (operating expense against cash) dated {closed_period_end}.
  The entry must be dated in period {closed_period}; if the books for that month are closed, do
  not post it anywhere else and explain what would need to happen.
seed: baseline
max_steps: 10
traps: [closed_period]
goal_state:
  - {check: balance_delta, account: "5100", delta_cents: 0}
  - {check: period_status, period: "{closed_period}", status: closed}
  - {check: report_mentions, any_of: [closed, PERIOD_CLOSED, reopen]}
  - {check: tb_balanced}
