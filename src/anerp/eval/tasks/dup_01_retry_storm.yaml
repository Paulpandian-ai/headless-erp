id: dup_01_retry_storm
module: procurement
narrative: >
  Order 20 HOSE-10M from BOLT at 25.00 each, have them received and post BOLT's matching invoice
  BOLT-20 (do not pay yet).
seed: baseline
max_steps: 20
traps: [retry]
repeat: 2
human_loop: [goods_acceptance]
goal_state:
  - {check: count, type: PurchaseOrder, where: {party: BOLT}, expected: 1}
  - {check: count, type: SupplierInvoice, where: {party: BOLT}, expected: 1}
  - {check: inventory_delta, sku: HOSE-10M, delta: 20}
  - {check: tb_balanced}
