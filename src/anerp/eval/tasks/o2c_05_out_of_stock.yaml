id: o2c_05_out_of_stock
module: sales
narrative: >
  NORTH orders 3 PUMP-SM at list price. Create the order and ship it. If it cannot ship, do not
  ship anything we do not have; explain what is missing and propose what to do next.
seed: baseline
max_steps: 16
traps: [stock]
goal_state:
  - {check: count, type: SalesOrder, where: {party: NORTH}, expected: 1}
  - {check: inventory_min, sku: PUMP-SM, min: 0}
  - {check: count, type: Shipment, where: {}, expected: 0}
  - {check: report_mentions, any_of: [stock, INSUFFICIENT_STOCK, on hand, receive]}
  - {check: tb_balanced}
