id: p2p_08_reverse_wrong_grn
module: procurement
narrative: >
  Yesterday someone recorded a goods receipt of 25 HOSE-10M against the open BOLT purchase order,
  but the goods never arrived; today 25 units actually arrived and the warehouse will count them.
  Correct the books so that exactly one receipt of 25 HOSE-10M stands against that order and stock
  is right.
seed: baseline
max_steps: 20
traps: [recovery]
human_loop: [goods_acceptance]
setup:
  - {tool: create_purchase_order, payload: {supplier: BOLT, lines: [{sku: HOSE-10M, qty: 25, unit_cost: "25.00"}]}, save_as: po}
  - {tool: receive_goods, payload: {po: "$po"}}
goal_state:
  - {check: count, type: GoodsReceipt, where: {status: posted, total_cents: 62500}, expected: 0, note: "relative to the post-setup baseline: wrong one reversed, right one posted"}
  - {check: count, type: GoodsReceipt, where: {status: reversed}, expected: 1}
  - {check: inventory_delta, sku: HOSE-10M, delta: 0}
  - {check: balance_delta, account: "1300", delta_cents: 0}
  - {check: tb_balanced}
