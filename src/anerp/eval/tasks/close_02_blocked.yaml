id: close_02_blocked
module: finance
narrative: >
  Run the month-end close for period {previous_period}: check readiness and close it if clean.
  If it cannot be closed, do not force it; report exactly what blocks the close.
seed: baseline
max_steps: 12
traps: [blocked_close]
setup:
  - {tool: create_purchase_order, payload: {supplier: ACME, lines: [{sku: VALVE-2IN, qty: 10, unit_cost: "50.00"}]}, save_as: po}
  - {tool: receive_goods, payload: {po: "$po"}}
  - {tool: post_supplier_invoice, payload: {po: "$po", supplier_reference: BLOCKED-1, posting_date: "{previous_period_end}", lines: [{sku: VALVE-2IN, qty: 10, unit_cost: "60.00"}], park_if_blocked: true}}
goal_state:
  - {check: period_status, period: "{previous_period}", status: open}
  - {check: report_mentions, any_of: [blocked, invoice, SINV]}
  - {check: tb_balanced}
