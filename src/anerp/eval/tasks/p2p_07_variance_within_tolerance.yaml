id: p2p_07_variance_within_tolerance
module: procurement
narrative: >
  Order 10 VALVE-2IN from ACME at 50.00 and have them received. Post ACME's invoice ACME-V1, which
  charges 50.50 per unit, and pay it in full.
seed: baseline
max_steps: 24
human_loop: [goods_acceptance]
goal_state:
  - {check: balance_delta, account: "5200", delta_cents: 500}
  - {check: balance_delta, account: "1000", delta_cents: -50500}
  - {check: open_items, kind: ap, party: ACME, total_remaining_cents: 0}
  - {check: tb_balanced}
