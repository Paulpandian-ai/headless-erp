# Fly.io app definition (dev and demo share it; the app name is passed by deploy.yml).
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "anerp migrate"

[env]
  ANERP_PORT = "8000"
  ANERP_LOG_LEVEL = "INFO"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
